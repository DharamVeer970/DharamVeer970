<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" role="img" aria-label="Agent architecture diagram. User, voice or API input passes through guardrails and intent classification, which routes either to a deterministic handler on the fast path or to a planner agent. The planner feeds an orchestrator that routes to research, code, and system agents. All three call a shared tool layer, which reads and writes memory. A critic then either sends work back to the planner to replan, or releases the verified final response. The deterministic fast path bypasses the agents and returns directly.">
