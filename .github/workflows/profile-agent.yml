name: Profile Agent

# Wakes up daily, asks the GitHub API what actually happened, and rewrites the
# "live agent log" section of README.md. Commits only when the output changed.

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily — off-the-hour to dodge scheduler congestion
  workflow_dispatch: # run it on demand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/profile_agent.py"
      - ".github/workflows/profile-agent.yml"

permissions:
  contents: write

concurrency:
  group: profile-agent
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh live section
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the profile agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/profile_agent.py

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "README is already current — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile-agent): refresh live section"
          git push
